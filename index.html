<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猜谜闯关游戏</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; color: #1f2937;
  }
  .card {
    width: 100%; max-width: 520px;
    background: #fff; border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    overflow: hidden; position: relative;
  }
  .topbar {
    background: linear-gradient(135deg, #6d5dfc, #8b5cf6);
    color: #fff; padding: 18px 22px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h1 { font-size: 18px; font-weight: 700; }
  .topbar .bank { font-size: 12px; opacity: .9; }
  .body { padding: 22px; }
  .hidden { display: none !important; }
  /* 登录 */
  #login .lock { font-size: 46px; text-align: center; margin: 8px 0 14px; }
  #login p.tip { text-align: center; color: #6b7280; font-size: 14px; margin-bottom: 18px; }
  input[type=password], input[type=number], select {
    width: 100%; padding: 13px 14px; font-size: 16px;
    border: 2px solid #e5e7eb; border-radius: 12px; outline: none;
    transition: border-color .15s;
  }
  input:focus, select:focus { border-color: #8b5cf6; }
  .btn {
    width: 100%; padding: 13px; font-size: 16px; font-weight: 600;
    border: none; border-radius: 12px; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, #6d5dfc, #8b5cf6);
    transition: transform .08s, opacity .15s; margin-top: 12px;
  }
  .btn:active { transform: scale(.98); }
  .btn.secondary { background: #eef2ff; color: #6d5dfc; }
  .err { color: #ef4444; font-size: 13px; text-align: center; min-height: 18px; margin-top: 8px; }
  /* 游戏 */
  .scorebar {
    display: flex; gap: 10px; margin-bottom: 16px;
  }
  .scorebox {
    flex: 1; background: #f3f4f6; border-radius: 12px; padding: 10px 12px; text-align: center;
  }
  .scorebox.active { background: #ede9fe; box-shadow: 0 0 0 2px #8b5cf6 inset; }
  .scorebox .who { font-size: 12px; color: #6b7280; }
  .scorebox .val { font-size: 24px; font-weight: 800; color: #6d5dfc; }
  .scorebox .target { font-size: 11px; color: #9ca3af; }
  .progress { height: 8px; background: #e5e7eb; border-radius: 6px; overflow: hidden; margin-bottom: 14px; }
  .progress > div { height: 100%; background: linear-gradient(90deg,#6d5dfc,#8b5cf6); width: 0%; transition: width .3s; }
  .qmeta { font-size: 13px; color: #9ca3af; margin-bottom: 8px; }
  .question { font-size: 19px; font-weight: 700; line-height: 1.5; margin-bottom: 16px; }
  .options { display: grid; gap: 10px; }
  .option {
    padding: 14px 16px; font-size: 16px; text-align: left;
    border: 2px solid #e5e7eb; border-radius: 12px; background: #fff;
    cursor: pointer; transition: all .12s; display: flex; align-items: center; gap: 10px;
  }
  .option .lab { width: 24px; height: 24px; flex: none; border-radius: 50%; background: #eef2ff; color: #6d5dfc; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 13px; }
  .option:hover:not(:disabled) { border-color: #8b5cf6; background: #faf5ff; }
  .option:disabled { cursor: default; }
  .option.correct { border-color: #10b981; background: #ecfdf5; color: #047857; }
  .option.wrong { border-color: #ef4444; background: #fef2f2; color: #b91c1c; }
  .feedback { margin-top: 14px; font-size: 14px; min-height: 20px; text-align: center; font-weight: 600; }
  .feedback.ok { color: #10b981; }
  .feedback.no { color: #ef4444; }
  .nextbtn { margin-top: 14px; }
  .foot { padding: 14px 22px; border-top: 1px solid #f3f4f6; display: flex; justify-content: center; }
  .foot button { background: none; border: none; color: #9ca3af; font-size: 13px; cursor: pointer; text-decoration: underline; }
  /* 胜利 */
  #win .trophy { font-size: 60px; text-align: center; margin: 10px 0; }
  #win .wtitle { text-align: center; font-size: 24px; font-weight: 800; color: #6d5dfc; }
  #win .wsub { text-align: center; color: #6b7280; margin: 8px 0 18px; }
  /* 设置弹窗 */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal .box { background: #fff; border-radius: 16px; padding: 22px; width: 100%; max-width: 420px; }
  .modal h2 { font-size: 18px; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #6b7280; margin-bottom: 6px; }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
</style>
</head>
<body>
<div class="card">
  <div class="topbar">
    <h1>🧠 猜谜闯关</h1>
    <span class="bank" id="bankCount"></span>
  </div>

  <!-- 登录 -->
  <div class="body" id="login">
    <div class="lock">🔐</div>
    <p class="tip">请输入密码进入游戏</p>
    <input type="password" id="pwd" placeholder="请输入密码" autocomplete="off">
    <button class="btn" id="enterBtn">进入游戏</button>
    <div class="err" id="loginErr"></div>
  </div>

  <!-- 游戏 -->
  <div class="body hidden" id="game">
    <div class="scorebar">
      <div class="scorebox" id="box1">
        <div class="who">玩家1</div>
        <div class="val" id="s1">0</div>
        <div class="target" id="t1"></div>
      </div>
      <div class="scorebox hidden" id="box2">
        <div class="who">玩家2</div>
        <div class="val" id="s2">0</div>
        <div class="target" id="t2"></div>
      </div>
    </div>
    <div class="progress"><div id="prog"></div></div>
    <div class="qmeta" id="qmeta"></div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn nextbtn hidden" id="nextBtn">下一题 →</button>
  </div>

  <!-- 胜利 -->
  <div class="body hidden" id="win">
    <div class="trophy">🏆</div>
    <div class="wtitle" id="winTitle">恭喜过关！</div>
    <div class="wsub" id="winSub"></div>
    <button class="btn" id="againBtn">再来一局</button>
  </div>

  <div class="foot">
    <button id="settingsBtn">⚙️ 设置</button>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal hidden" id="settingsModal">
  <div class="box">
    <h2>⚙️ 游戏设置</h2>
    <div class="field">
      <label>每答对一题加多少分</label>
      <input type="number" id="setPer" min="1" value="10">
    </div>
    <div class="field">
      <label>达到多少分赢得比赛</label>
      <input type="number" id="setWin" min="1" value="200">
    </div>
    <div class="field">
      <label>游戏模式</label>
      <select id="setMode">
        <option value="single">单人模式</option>
        <option value="double">双人模式（轮流答题）</option>
      </select>
    </div>
    <div class="field" id="firstField">
      <label>谁先手（双人模式）</label>
      <select id="setFirst">
        <option value="p1">玩家1 先</option>
        <option value="p2">玩家2 先</option>
      </select>
    </div>
    <button class="btn" id="saveSettings">保存并开始新游戏</button>
    <button class="btn secondary" id="closeSettings" style="margin-top:8px;">取消</button>
  </div>
</div>

const PASSWORD = "1107";

const settings = Object.assign(
  { per: 10, win: 200, mode: "single", first: "p1" },
  JSON.parse(localStorage.getItem("quiz_settings") || "{}")
);

const state = {
  queue: [],
  idx: 0,
  s1: 0, s2: 0,
  current: null,
  turn: "p1",
  answered: 0,
  activePlayer: 1
};

const $ = id => document.getElementById(id);
$("bankCount").textContent = "题库 " + BANK.length + " 题";

// 登录
function tryEnter() {
  const v = $("pwd").value.trim();
  if (v === PASSWORD) {
    $("loginErr").textContent = "";
    startGame();
  } else {
    $("loginErr").textContent = "密码错误，请重试";
  }
}
$("enterBtn").onclick = tryEnter;
$("pwd").addEventListener("keydown", e => { if (e.key === "Enter") tryEnter(); });

function shuffleArr(a){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function startGame() {
  state.queue = shuffleArr([...Array(BANK.length).keys()]);
  state.idx = 0; state.s1 = 0; state.s2 = 0; state.answered = 0;
  state.turn = settings.first === "p2" ? "p2" : "p1";
  state.activePlayer = state.turn === "p2" ? 2 : 1;
  show("game");
  $("box2").classList.toggle("hidden", settings.mode !== "double");
  updateScoreUI();
  nextQuestion();
}

function show(screen) {
  ["login","game","win"].forEach(s => $(s).classList.toggle("hidden", s !== screen));
}

function updateScoreUI() {
  $("s1").textContent = state.s1;
  $("s2").textContent = state.s2;
  $("t1").textContent = "目标 " + settings.win;
  $("t2").textContent = "目标 " + settings.win;
  $("box1").classList.toggle("active", settings.mode === "double" && state.activePlayer === 1);
  $("box2").classList.toggle("active", settings.mode === "double" && state.activePlayer === 2);
}

function nextQuestion() {
  if (state.idx >= state.queue.length) state.queue = shuffleArr([...Array(BANK.length).keys()]);
  const qi = state.queue[state.idx % BANK.length];
  state.current = BANK[qi];
  state.idx++;
  $("question").textContent = state.current.q;
  $("qmeta").textContent = "第 " + (state.answered + 1) + " 题 · 答对 +" + settings.per + " 分";
  const labels = ["A","B","C","D"];
  const wrap = $("options"); wrap.innerHTML = "";
  state.current.o.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "option";
    b.innerHTML = '<span class="lab">' + labels[i] + '</span><span>' + opt + '</span>';
    b.onclick = () => choose(i, b);
    wrap.appendChild(b);
  });
  $("feedback").textContent = "";
  $("feedback").className = "feedback";
  $("nextBtn").classList.add("hidden");
  updateProgress();
}

function updateProgress() {
  const cur = Math.max(state.s1, state.s2);
  const pct = Math.min(100, (cur / settings.win) * 100);
  $("prog").style.width = pct + "%";
}

function choose(i, btn) {
  const correct = i === state.current.a;
  const buttons = $("options").querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);
  buttons[state.current.a].classList.add("correct");
  if (!correct) btn.classList.add("wrong");

  if (correct) {
    if (state.activePlayer === 1) state.s1 += settings.per; else state.s2 += settings.per;
    $("feedback").textContent = "✅ 回答正确！+" + settings.per + " 分";
    $("feedback").className = "feedback ok";
  } else {
    $("feedback").textContent = "❌ 回答错误，正确答案已标绿";
    $("feedback").className = "feedback no";
  }
  state.answered++;
  updateScoreUI();
  updateProgress();

  // 胜利判定
  if (state.s1 >= settings.win || state.s2 >= settings.win) {
    setTimeout(showWin, 700);
    return;
  }
  $("nextBtn").classList.remove("hidden");
}

$("nextBtn").onclick = () => {
  if (settings.mode === "double") {
    state.activePlayer = state.activePlayer === 1 ? 2 : 1;
    updateScoreUI();
  }
  nextQuestion();
};

function showWin() {
  const winner = state.s2 >= settings.win ? "玩家2" : "玩家1";
  if (settings.mode === "double") {
    $("winTitle").textContent = "🏆 " + winner + " 获胜！";
    $("winSub").textContent = "玩家1：" + state.s1 + " 分　玩家2：" + state.s2 + " 分";
  } else {
    $("winTitle").textContent = "🎉 恭喜过关！";
    $("winSub").textContent = "你答对了足够的题目，最终得分 " + state.s1 + " 分";
  }
  show("win");
}

$("againBtn").onclick = startGame;

// 设置
$("settingsBtn").onclick = () => {
  $("setPer").value = settings.per;
  $("setWin").value = settings.win;
  $("setMode").value = settings.mode;
  $("setFirst").value = settings.first;
  $("firstField").style.display = settings.mode === "double" ? "block" : "none";
  $("settingsModal").classList.remove("hidden");
};
$("setMode").onchange = e => { $("firstField").style.display = e.target.value === "double" ? "block" : "none"; };
$("closeSettings").onclick = () => $("settingsModal").classList.add("hidden");
$("saveSettings").onclick = () => {
  settings.per = Math.max(1, parseInt($("setPer").value) || 10);
  settings.win = Math.max(1, parseInt($("setWin").value) || 200);
  settings.mode = $("setMode").value;
  settings.first = $("setFirst").value;
  localStorage.setItem("quiz_settings", JSON.stringify(settings));
  $("settingsModal").classList.add("hidden");
  startGame();
};
</script>
